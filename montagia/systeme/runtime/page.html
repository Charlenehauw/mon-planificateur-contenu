<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=__LARGEUR__, height=__HAUTEUR__" />
<title>Montag'IA</title>
<script src="gsap.min.js"></script>
<style>
  @font-face { font-family: "Sora"; src: url("fonts/Sora.ttf"); font-weight: 100 800; font-display: block; }
  @font-face { font-family: "Archivo"; src: url("fonts/Archivo.ttf"); font-weight: 100 900; font-stretch: 62% 125%; font-display: block; }
  @font-face { font-family: "Archivo Black"; src: url("fonts/ArchivoBlack-Regular.ttf"); font-display: block; }
  @font-face { font-family: "Playfair Display"; src: url("fonts/PlayfairDisplay.ttf"); font-weight: 400 900; font-display: block; }
  @font-face { font-family: "Montserrat"; src: url("fonts/Montserrat.ttf"); font-weight: 100 900; font-display: block; }
  @font-face { font-family: "Poppins"; src: url("fonts/Poppins-Bold.ttf"); font-weight: 700; font-display: block; }
  @font-face { font-family: "Bebas Neue"; src: url("fonts/BebasNeue-Regular.ttf"); font-display: block; }
  @font-face { font-family: "Caveat"; src: url("fonts/Caveat.ttf"); font-weight: 400 700; font-display: block; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: "Sora", sans-serif; }
  #fond { position: absolute; inset: 0; z-index: 0; }
  #cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 1; transform-origin: 0 0; overflow: hidden; border-radius: 0; }
  #cam video#v-base, #cam video#v-detour { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
  #derriere { position: absolute; inset: 0; z-index: 2; perspective: 1200px; }
  #cam video#v-detour { z-index: 3; }
  #dessus { position: absolute; inset: 0; z-index: 5; pointer-events: none; perspective: 1200px; }
  #plein { position: absolute; inset: 0; z-index: 8; pointer-events: none; }
  .m-plein { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
  em { font-style: normal; }

  /* accroche */
  .m-accroche { position: absolute; left: 70px; width: 940px; top: 210px; padding: 26px 36px; text-align: center; line-height: 1.12; font-weight: 700; box-shadow: 0 18px 50px rgba(0,0,0,0.35); visibility: hidden; }
  .m-accroche em { color: var(--accent); }

  /* sous-titres */
  .m-st-hote { position: absolute; inset: 0; z-index: 9; pointer-events: none; }
  .m-st { position: absolute; left: 60px; width: 960px; text-align: center; white-space: nowrap; visibility: hidden; line-height: 1.1; }
  .m-st em { color: var(--mot-cle); }

  /* carte mot */
  .m-carte-mot { position: absolute; left: 0; width: 1080px; top: 830px; text-align: center; font-size: 170px; font-weight: 700; color: #fff; white-space: nowrap; line-height: 1; }
  .m-carte-mot em { color: var(--accent); }

  /* carte titre cinéma */
  .m-tc { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .m-tc-petit { font-family: "Archivo"; font-weight: 600; font-stretch: 125%; letter-spacing: 16px; text-transform: uppercase; color: #e9ecf1; font-size: 36px; margin-bottom: 18px; white-space: nowrap; text-shadow: 0 3px 12px rgba(0,0,0,0.6); }
  .m-chrome { font-family: "Archivo"; font-weight: 800; font-stretch: 125%; text-transform: uppercase; white-space: nowrap; line-height: 1; background: linear-gradient(180deg, #ffffff 0%, #f1f3f7 38%, #8e96a3 50%, #dfe3ea 64%, #a3aab6 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 14px rgba(0,0,0,0.6)); }
  .m-flare { position: absolute; left: 0; top: 0; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(200,220,255,0.45) 18%, rgba(255,255,255,0) 60%); mix-blend-mode: screen; }
  .m-flare::after { content: ""; position: absolute; left: -120px; top: 78px; width: 400px; height: 4px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.9), rgba(255,255,255,0)); }

  /* b-roll */
  .m-broll video { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
  .m-fenetre { position: absolute; left: 90px; top: 230px; width: 900px; height: 600px; border-radius: 34px; overflow: hidden; box-shadow: 0 24px 70px rgba(0,0,0,0.55); outline: 4px solid rgba(255,255,255,0.92); visibility: hidden; }
  .m-fenetre video { width: 100%; height: 100%; object-fit: cover; }

  /* étiquettes */
  .m-etiq-hote { position: absolute; left: 60px; width: 900px; display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; visibility: hidden; }
  .m-etiq { display: flex; align-items: center; gap: 12px; background: var(--clair); border-radius: 999px; padding: 10px 22px 10px 12px; box-shadow: 0 8px 26px rgba(0,0,0,0.35); font-weight: 700; font-size: 30px; color: var(--sombre); white-space: nowrap; visibility: hidden; }
  .m-etiq .ic { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .m-etiq .ic svg { width: 24px; height: 24px; }
  .m-etiq em { color: var(--accent); }

  /* compteur */
  .m-compteur { position: absolute; left: 90px; width: 900px; text-align: center; visibility: hidden; }
  .m-cpt-n { font-size: 150px; line-height: 1; text-shadow: 0 8px 30px rgba(0,0,0,0.55); }
  .m-cpt-n em { color: var(--accent); }
  .m-cpt-l { margin-top: 8px; font-family: "Sora"; font-weight: 700; font-size: 36px; color: #fff; text-shadow: 0 3px 14px rgba(0,0,0,0.7); }
  .m-cpt-l em { color: var(--accent); }

  /* cadre explicatif */
  .m-cadre { position: absolute; left: 270px; top: 900px; width: 540px; height: 960px; border-radius: 30px; border: 4px solid rgba(255,255,255,0.85); box-shadow: 0 0 40px rgba(0,0,0,0.5); z-index: 6; visibility: hidden; }
  .m-expl { position: absolute; left: 90px; top: 210px; width: 900px; z-index: 7; color: #fff; visibility: hidden; }
  .m-expl-kick { font-size: 26px; font-weight: 700; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 14px; }
  .m-expl-titre { font-size: 76px; font-weight: 800; line-height: 1.04; margin-bottom: 34px; }
  .m-expl-titre em { color: var(--accent); }
  .m-expl-item { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 26px; visibility: hidden; }
  .m-expl-item .ck { position: relative; width: 52px; height: 52px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.35); flex: 0 0 52px; }
  .m-expl-item .fill { position: absolute; inset: -3px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .m-expl-item .fill svg { width: 30px; height: 30px; }
  .m-expl-item small { display: block; font-size: 22px; letter-spacing: 4px; color: rgba(255,255,255,0.55); }
  .m-expl-item b { display: block; font-size: 40px; font-weight: 700; margin-top: 2px; }
  .m-expl-item b em { color: var(--accent); }

  /* objet 3D */
  .m-o3d { position: absolute; left: 0; top: 0; perspective: 900px; visibility: hidden; z-index: 4; }
  .m-o3d-in { position: absolute; inset: 0; transform-style: preserve-3d; }
  .m-o3d-in img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }

  /* vitre */
  .m-vitre { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 20; pointer-events: none; visibility: hidden; }
  .m-flash { position: absolute; inset: 0; background: #fff; z-index: 21; opacity: 0; pointer-events: none; }

  /* téléphones */
  .m-phones { position: absolute; inset: 0; transform-style: preserve-3d; }
  .m-ph { position: absolute; width: 300px; height: 540px; border-radius: 42px; background: #000; border: 6px solid #1d1b21; box-shadow: 0 0 0 1.5px rgba(255,255,255,0.18), 0 22px 50px rgba(0,0,0,0.55); overflow: hidden; visibility: hidden; }
  .m-ph video, .m-ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* texte derrière */
  .m-chrome.plein-couleur { background: none; -webkit-background-clip: initial; background-clip: initial; filter: none; text-shadow: 0 6px 24px rgba(0,0,0,0.12); }
  .m-derriere .m-tc-petit { text-shadow: none; }
  .m-derriere { position: absolute; left: 0; width: 1080px; display: flex; flex-direction: column; align-items: center; visibility: hidden; }

  /* documentaire */
  .m-doc { background-color: #ECE9E2; background-image: radial-gradient(rgba(0,0,0,0.035) 1px, transparent 1.2px), radial-gradient(rgba(0,0,0,0.025) 1px, transparent 1.4px); background-size: 7px 7px, 11px 11px; background-position: 0 0, 3px 5px; }
  .m-doc-sun { position: absolute; left: 140px; top: 520px; width: 800px; height: 800px; border-radius: 50%; }
  .m-doc-cut { position: absolute; inset: 0; filter: grayscale(1) contrast(1.22) brightness(1.04) drop-shadow(6px 0 0 #fff) drop-shadow(-6px 0 0 #fff) drop-shadow(0 6px 0 #fff) drop-shadow(0 -6px 0 #fff) drop-shadow(0 12px 22px rgba(0,0,0,0.35)); }
  .m-doc-monde { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
  .m-doc-monde video { width: 1080px; height: 1920px; object-fit: cover; }
  .m-doc-nom { position: absolute; left: 60px; top: 1400px; padding: 14px 24px; background: #111; color: #fff; font-family: "Archivo Black"; font-size: 46px; letter-spacing: 1px; white-space: nowrap; }
  .m-doc-tag { position: absolute; left: 60px; top: 1490px; padding: 6px 16px; color: #111; font-family: "Archivo Black"; font-size: 28px; letter-spacing: 2px; white-space: nowrap; }
  .m-doc-stk { position: absolute; padding: 12px 26px; background: #F1EEE6; color: #111; font-family: "Archivo Black"; font-size: 56px; letter-spacing: 1px; white-space: nowrap; box-shadow: 0 6px 16px rgba(0,0,0,0.35); opacity: 0; }

  /* CTA commentaire */
  .m-cta { position: absolute; left: 0; width: 1080px; visibility: hidden; }
  .m-cta-kick { text-align: center; font-weight: 700; font-size: 34px; letter-spacing: 5px; color: #fff; text-shadow: 0 3px 12px rgba(0,0,0,0.6); margin-bottom: 18px; }
  .m-cta-pill { margin-left: 90px; width: 900px; height: 150px; border-radius: 999px; background: #fff; box-shadow: 0 16px 50px rgba(0,0,0,0.35); display: flex; align-items: center; padding: 0 34px; gap: 26px; }
  .m-cta-av { width: 92px; height: 92px; border-radius: 50%; flex: 0 0 92px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 32px; color: #fff; }
  .m-cta-txt { font-weight: 800; font-size: 56px; letter-spacing: 3px; white-space: nowrap; }
  .m-cta-cur { width: 5px; height: 60px; margin-left: 2px; }
  .m-cta-send { margin-left: auto; }

  /* image */
  .m-image { position: absolute; border-radius: 22px; overflow: hidden; box-shadow: 0 24px 70px rgba(0,0,0,0.55); outline: 5px solid rgba(255,255,255,0.92); visibility: hidden; }
  .m-image img { display: block; width: 100%; }

  /* icônes */
  .m-icones { position: absolute; left: 0; width: 1080px; display: flex; justify-content: center; gap: 70px; visibility: hidden; }
  .m-icone { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; visibility: hidden; }
  .m-icone img { width: 150px; height: 150px; object-fit: contain; border-radius: 34px; filter: drop-shadow(0 12px 26px rgba(0,0,0,0.35)); }
  .m-icone span { font-size: 28px; font-weight: 700; color: var(--sombre); background: var(--clair); padding: 4px 16px; border-radius: 999px; box-shadow: 0 6px 18px rgba(0,0,0,0.25); }
  .m-icone-barre { position: absolute; left: -10px; top: 70px; width: 170px; height: 10px; background: #E5484D; border-radius: 6px; transform: rotate(-35deg); transform-origin: 0 50%; box-shadow: 0 0 0 3px #fff; }

  /* fenêtre d'application */
  .m-app { position: absolute; left: 110px; width: 860px; border-radius: 20px; overflow: hidden; background: var(--clair); box-shadow: 0 26px 70px rgba(0,0,0,0.4); visibility: hidden; }
  .m-app-barre { height: 54px; display: flex; align-items: center; gap: 10px; padding: 0 20px; background: rgba(0,0,0,0.05); font-size: 22px; color: rgba(0,0,0,0.55); font-weight: 600; }
  .m-app-barre i { width: 16px; height: 16px; border-radius: 50%; display: inline-block; }
  .m-app-barre span { margin-left: 14px; }
  .m-app-corps img { display: block; width: 100%; max-height: 480px; object-fit: cover; object-position: 50% 0%; }
  .m-app-texte { padding: 26px 34px 32px; font-size: 52px; font-weight: 700; color: var(--sombre); line-height: 1.1; }
  .m-app-texte em { color: var(--accent); }

  .m-expl.clair .m-expl-item small { color: rgba(0,0,0,0.45); }
  .m-expl.clair .m-expl-item .ck { border-color: rgba(0,0,0,0.25); }
  .m-cadre.clair { border-color: #fff; box-shadow: 0 20px 50px rgba(0,0,0,0.25); }

  /* illustrations latérales */
  .m-illus { position: absolute; width: 288px; perspective: 1000px; visibility: hidden; z-index: 6; }
  .m-illus.g { left: 22px; } .m-illus.d { left: 770px; }
  .m-illus-carte { position: relative; padding: 30px 24px 26px; border-radius: 38px; background: rgba(255,255,255,0.88); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    box-shadow: 0 24px 60px rgba(0,0,0,0.28), inset 0 0 0 1.5px rgba(255,255,255,0.9); display: flex; flex-direction: column; align-items: center; text-align: center; transform-style: preserve-3d; backface-visibility: hidden; }
  .m-illus-carte.dos { position: absolute; left: 0; top: 0; width: 100%; }
  .m-illus-ic svg { width: 118px; height: 118px; stroke-width: 1.7; }
  .m-illus-chiffre { font-size: 96px; line-height: 1; white-space: nowrap; }
  .m-illus-txt { margin-top: 14px; font-size: 31px; font-weight: 800; line-height: 1.12; color: #111; }
  .m-illus-txt em { color: var(--accent); }
  .m-illus-sous { margin-top: 6px; font-family: "Sora"; font-size: 22px; font-weight: 600; color: rgba(0,0,0,0.5); }

  .m-venn, .m-route { width: 900px; height: auto; display: block; margin-top: 10px; }
  .m-venn-txt { font-family: "Sora"; font-weight: 800; font-size: 44px; }
  .m-venn-commun { font-family: "Sora"; font-weight: 800; font-size: 40px; }
  .m-route-txt { font-family: "Sora"; font-weight: 700; font-size: 34px; }
  .m-vs { position: absolute; left: 470px; width: 140px; height: 140px; border-radius: 50%; color: #fff; font-size: 54px; display: flex; align-items: center; justify-content: center; box-shadow: 0 16px 40px rgba(0,0,0,0.3); visibility: hidden; z-index: 7; }
  .m-pixel { position: absolute; left: 0; top: 0; height: 440px; width: auto; image-rendering: pixelated; visibility: hidden; filter: drop-shadow(0 10px 0 rgba(0,0,0,0.18)); z-index: 7; }
  .m-st .k { display: inline-block; }
  .m-st .k.cle { font-weight: 900; }

  .m-sm { position: absolute; visibility: hidden; z-index: 6; }
  .m-sm em, .m-illus-carte em { font-style: normal; color: var(--accent); }

  /* chapitre : carte de titre de partie (YouTube surtout), plein écran ou bandeau */
  .m-chap-fond { position: absolute; inset: 0; }
  .m-chap-contenu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .m-chap-num { font-weight: 700; font-size: 34px; letter-spacing: 10px; text-transform: uppercase; margin-bottom: 22px; white-space: nowrap; }
  .m-chap-titre { font-weight: 800; font-size: 104px; line-height: 1.05; max-width: 900px; }
  .m-chap-titre em { color: var(--accent); }
  .m-chap-trait { width: 160px; height: 8px; border-radius: 4px; margin-top: 34px; transform-origin: 0 50%; }
  .m-chap-bandeau { position: absolute; left: 70px; top: 70px; padding: 22px 34px 24px 30px; border-radius: 22px; box-shadow: 0 18px 50px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 22px; visibility: hidden; z-index: 7; }
  .m-chap-bandeau .m-chap-num { margin: 0; font-size: 26px; letter-spacing: 6px; padding-right: 22px; border-right: 3px solid currentColor; }
  .m-chap-bandeau .m-chap-titre { font-size: 46px; max-width: 1100px; white-space: nowrap; }

  /* ───── format YouTube : paysage 1920 x 1080 (le vertical n'est pas concerné) ───── */
  #root.format-youtube { width: 1920px; height: 1080px; }
  #root.format-youtube #cam { width: 1920px; height: 1080px; }
  #root.format-youtube #cam video#v-base, #root.format-youtube #cam video#v-detour, #root.format-youtube #cam video.v-base, #root.format-youtube #cam video.v-detour { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }
  #root.format-youtube #cam video.v-detour { z-index: 3; }
  #root.format-youtube .m-accroche { left: 310px; width: 1300px; top: 64px; }
  #root.format-youtube .m-st { left: 160px; width: 1600px; }
  #root.format-youtube .m-carte-mot { width: 1920px; top: 455px; }
  #root.format-youtube .m-broll video { width: 1920px; height: 1080px; }
  #root.format-youtube .m-fenetre { left: 1110px; top: 90px; width: 740px; height: 416px; border-radius: 28px; }
  #root.format-youtube .m-etiq-hote { left: 260px; width: 1400px; }
  #root.format-youtube .m-compteur { width: 620px; }
  #root.format-youtube .m-cpt-n { font-size: 132px; }
  #root.format-youtube .m-cadre { left: 900px; top: 270px; width: 960px; height: 540px; }
  #root.format-youtube .m-expl { left: 80px; top: 150px; width: 760px; }
  #root.format-youtube .m-expl-titre { font-size: 64px; margin-bottom: 28px; }
  #root.format-youtube .m-expl-item b { font-size: 36px; }
  #root.format-youtube .m-vitre { width: 1920px; height: 1080px; }
  #root.format-youtube .m-ph { width: 250px; height: 450px; }
  #root.format-youtube .m-derriere { width: 1920px; }
  #root.format-youtube .m-doc-sun { left: 560px; top: 140px; }
  #root.format-youtube .m-doc-monde, #root.format-youtube .m-doc-monde video { width: 1920px; height: 1080px; }
  #root.format-youtube .m-doc-nom { left: 80px; top: 800px; }
  #root.format-youtube .m-doc-tag { left: 80px; top: 890px; }
  #root.format-youtube .m-cta { width: 1920px; }
  #root.format-youtube .m-cta-pill { margin-left: 510px; }
  #root.format-youtube .m-icones { width: 1920px; }
  #root.format-youtube .m-icone img { width: 120px; height: 120px; border-radius: 28px; }
  #root.format-youtube .m-app { left: 1150px; width: 700px; }
  #root.format-youtube .m-app-texte { font-size: 44px; }
  #root.format-youtube .m-illus { width: 340px; }
  #root.format-youtube .m-illus.g { left: 70px; } #root.format-youtube .m-illus.d { left: 1510px; }
  #root.format-youtube .m-illus-ic svg { width: 128px; height: 128px; }
  #root.format-youtube .m-illus-txt { font-size: 34px; }
  #root.format-youtube .m-venn, #root.format-youtube .m-route { width: 760px; }
  #root.format-youtube .m-vs { left: 890px; }
  #root.format-youtube .m-pixel { height: 300px; }
  #root.format-youtube .m-chap-titre { max-width: 1500px; font-size: 112px; }
  #root.format-youtube .m-chap-bandeau .m-chap-titre { font-size: 48px; max-width: 1500px; }
</style>
</head>
<body>
<div id="root" class="format-__FORMAT__" data-composition-id="montagia" data-start="0" data-width="__LARGEUR__" data-height="__HAUTEUR__" data-duration="__DUREE__" data-fps="30">
  <div id="fond"></div>
  <div id="cam">
    <video id="v-base" src="media/base.mp4" muted playsinline data-start="0" data-duration="__DUREE__" data-track-index="1"></video>
    <div id="derriere"></div>
    __DETOURAGE__
  </div>
  <div id="dessus"></div>
  <div id="plein"></div>
  <div id="pool" style="display:none">
    __MEDIAS__
  </div>
</div>
<script src="donnees.js"></script>
__SUR_MESURE__
<script src="montagia.js"></script>
<script>
  window.__timelines = window.__timelines || {};
  /* window.__timelines["montagia"] est enregistré par montagia.js dès que la page est prête */
</script>
</body>
</html>
